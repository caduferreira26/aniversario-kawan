<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07152f">
  <title>Meu príncipe</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Georgia, "Times New Roman", serif;
      background: #07152f;
      color: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 110%, rgba(20, 112, 220, .48), transparent 55%),
        radial-gradient(ellipse at 12% 18%, rgba(224, 36, 55, .28), transparent 36%),
        linear-gradient(145deg, #102b59 0%, #091a3a 46%, #050e22 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 28rem;
      height: 28rem;
      border: 1px solid rgba(187, 218, 255, .09);
      border-radius: 50%;
      pointer-events: none;
    }

    body::before {
      top: -17rem;
      right: -9rem;
      box-shadow: 0 0 0 38px rgba(187, 218, 255, .025), 0 0 0 80px rgba(187, 218, 255, .02);
    }

    body::after {
      bottom: -21rem;
      left: -12rem;
      width: 38rem;
      height: 38rem;
      box-shadow: 0 0 0 1px rgba(187, 218, 255, .06), 0 0 90px rgba(50, 133, 235, .15);
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        repeating-conic-gradient(from 0deg at 16% 18%, transparent 0deg 14deg, rgba(220, 235, 255, .09) 14.3deg 14.6deg, transparent 14.9deg 30deg),
        repeating-radial-gradient(circle at 16% 18%, transparent 0 34px, rgba(220, 235, 255, .08) 35px 36px, transparent 37px 65px),
        radial-gradient(2px 2px at 12% 23%, #d7eaff 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 25% 72%, #d7eaff 50%, transparent 100%),
        radial-gradient(2px 2px at 78% 19%, #d7eaff 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 87% 68%, #d7eaff 50%, transparent 100%),
        radial-gradient(1px 1px at 67% 84%, #d7eaff 50%, transparent 100%),
        radial-gradient(1px 1px at 43% 13%, #d7eaff 50%, transparent 100%);
      opacity: .7;
      animation: twinkle 4s ease-in-out infinite alternate;
    }

    .web-spider {
      position: fixed;
      z-index: 3;
      top: 0;
      left: clamp(1.5rem, 12vw, 9rem);
      width: 2px;
      height: 0;
      background: linear-gradient(#d7eaff, rgba(215, 234, 255, .55));
      transform-origin: top;
      animation: spider-drop 2.8s cubic-bezier(.22,.75,.32,1) .25s forwards;
      pointer-events: none;
    }

    .web-spider svg {
      position: absolute;
      bottom: -2.35rem;
      left: 50%;
      width: 3rem;
      height: 3rem;
      overflow: visible;
      transform: translateX(-50%);
      animation: spider-sway 1.4s ease-in-out 3.1s infinite alternate;
      transform-origin: 50% 0;
    }

    .web-spider .legs {
      fill: none;
      stroke: #e7f1ff;
      stroke-linecap: round;
      stroke-width: 2.4;
    }

    .web-spider .body {
      fill: #e3293f;
      stroke: #101a2d;
      stroke-width: 1.5;
    }

    .web-spider .eyes {
      fill: #fff;
      stroke: #101a2d;
      stroke-width: .8;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(90vw, 680px);
      padding: clamp(2.5rem, 8vw, 5.5rem) 2rem;
      text-align: center;
      border: 1px solid rgba(211, 231, 255, .19);
      border-radius: 2rem;
      background: linear-gradient(145deg, rgba(255, 255, 255, .105), rgba(255, 255, 255, .035));
      box-shadow: 0 30px 100px rgba(0, 0, 0, .28), inset 0 1px rgba(255, 255, 255, .12);
      backdrop-filter: blur(14px);
      animation: appear 1.1s ease-out both;
    }

    .crown {
      display: inline-block;
      margin-bottom: 1.5rem;
      color: #ff5261;
      font-family: "Segoe UI Symbol", sans-serif;
      font-size: 2rem;
      filter: drop-shadow(0 0 14px rgba(255, 67, 83, .45));
    }

    .eyebrow {
      margin: 0 0 .75rem;
      color: #ff9aa4;
      font-family: "Segoe UI", sans-serif;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .34em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(3.2rem, 10vw, 6.3rem);
      font-weight: 400;
      letter-spacing: -.055em;
      line-height: 1.04;
      text-shadow: 0 4px 35px rgba(45, 139, 255, .45);
    }

    h1 span {
      display: block;
      color: #ff5365;
      font-style: italic;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .8rem;
      margin: 1.8rem auto 1.4rem;
      color: #ff5261;
      font-size: .85rem;
    }

    .divider::before,
    .divider::after {
      content: "";
      width: 3.2rem;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 82, 97, .8));
    }

    .divider::after {
      transform: rotate(180deg);
    }

    .message {
      max-width: 27rem;
      margin: 0 auto;
      color: #d7e6fb;
      font-size: clamp(1.05rem, 2.8vw, 1.3rem);
      line-height: 1.8;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .75rem;
      margin-top: 1.7rem;
    }

    nav a {
      padding: .65rem 1rem;
      border: 1px solid rgba(221, 237, 255, .25);
      border-radius: 999px;
      color: #d7e6fb;
      font: 500 .85rem "Segoe UI", sans-serif;
      text-decoration: none;
      transition: background .2s ease, border-color .2s ease;
    }

    nav a:hover,
    nav a:focus-visible {
      border-color: rgba(221, 237, 255, .65);
      background: rgba(159, 202, 255, .16);
    }

    .birthday {
      display: inline-block;
      margin: 1.4rem 0 0;
      padding: .55rem 1rem;
      border: 1px solid rgba(255, 82, 97, .4);
      border-radius: 999px;
      color: #ff9aa4;
      font: 500 .9rem "Segoe UI", sans-serif;
      letter-spacing: .04em;
    }

    button {
      margin-top: 2rem;
      padding: .85rem 1.35rem;
      border: 1px solid rgba(221, 237, 255, .32);
      border-radius: 999px;
      background: rgba(159, 202, 255, .12);
      color: #fff;
      cursor: pointer;
      font: 500 .9rem "Segoe UI", sans-serif;
      letter-spacing: .03em;
      transition: background .2s ease, transform .2s ease, border-color .2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      border-color: rgba(221, 237, 255, .7);
      background: rgba(159, 202, 255, .22);
    }

    button:focus-visible {
      outline: 2px solid #ff5261;
      outline-offset: 4px;
    }

    .heart {
      position: fixed;
      z-index: 2;
      bottom: 12%;
      left: var(--left);
      color: #ffb9cf;
      font: 1.5rem "Segoe UI Symbol", sans-serif;
      pointer-events: none;
      animation: float-up 2.4s ease-out forwards;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes twinkle {
      from { opacity: .4; }
      to { opacity: .9; }
    }

    @keyframes spider-drop {
      0% { height: 0; }
      68% { height: min(30vh, 220px); }
      82% { height: min(27vh, 198px); }
      100% { height: min(29vh, 212px); }
    }

    @keyframes spider-sway {
      from { transform: translateX(-50%) rotate(-7deg); }
      to { transform: translateX(-50%) rotate(7deg); }
    }

    @keyframes float-up {
      to { opacity: 0; transform: translateY(-70vh) rotate(18deg) scale(1.5); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="web-spider" aria-hidden="true">
    <svg viewBox="0 0 48 48">
      <g class="legs">
        <path d="M19 19 10 12 4 14M17 23 8 21 3 26M18 28 9 32 5 38M21 32 16 40 14 46"/>
        <path d="m29 19 9-7 6 2m-5 7 6 6 1 5m-6 0 9 4 4 6m-15-9 5 9 2 4"/>
      </g>
      <ellipse class="body" cx="24" cy="27" rx="8" ry="10"/>
      <circle class="body" cx="24" cy="16" r="6"/>
      <ellipse class="eyes" cx="21.5" cy="15.5" rx="1.5" ry="2.1"/>
      <ellipse class="eyes" cx="26.5" cy="15.5" rx="1.5" ry="2.1"/>
    </svg>
  </div>
  <main>
    <p class="eyebrow">Para Kawan</p>
    <h1>Meu <span>príncipe</span></h1>
    <div class="divider" aria-hidden="true">✦</div>
    <p class="message">Você deixa meus dias mais bonitos e meu coração mais feliz. Que sorte a minha ter você!</p>
    <p class="birthday">🎂 15 de novembro · seu dia especial</p>
    <nav aria-label="Mais páginas">
      <a href="carta.html">Uma cartinha</a>
      <a href="aniversario.html">Aniversário do Kawan</a>
      <a href="sobre-kawan.html">Sobre o Kawan</a>
      <a href="jogo.html">Jogar</a>
    </nav>
    <button type="button" id="kiss">Enviar um beijo <span aria-hidden="true">♡</span></button>
  </main>
  <script>
    const kissButton = document.querySelector("#kiss");

    kissButton.addEventListener("click", () => {
      const heart = document.createElement("span");
      heart.className = "heart";
      heart.textContent = "♥";
      heart.style.setProperty("--left", `${20 + Math.random() * 60}%`);
      heart.setAttribute("aria-hidden", "true");
      document.body.append(heart);
      heart.addEventListener("animationend", () => heart.remove(), { once: true });
    });
  </script>
</body>
</html>
