<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07152f">
  <title>Jogo das aranhas</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Georgia, "Times New Roman", serif;
      color: #fff;
      background: #07152f;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      background:
        radial-gradient(ellipse at 50% 110%, rgba(20, 112, 220, .48), transparent 55%),
        radial-gradient(ellipse at 12% 18%, rgba(224, 36, 55, .28), transparent 36%),
        linear-gradient(145deg, #102b59, #091a3a 46%, #050e22);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        repeating-conic-gradient(from 0deg at 16% 18%, transparent 0deg 14deg, rgba(220, 235, 255, .09) 14.3deg 14.6deg, transparent 14.9deg 30deg),
        repeating-radial-gradient(circle at 16% 18%, transparent 0 34px, rgba(220, 235, 255, .08) 35px 36px, transparent 37px 65px);
      mask-image: radial-gradient(ellipse at 16% 18%, #000 0%, transparent 68%);
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(92vw, 650px);
      padding: clamp(1.5rem, 6vw, 3rem);
      border: 1px solid rgba(255, 82, 97, .3);
      border-radius: 2rem;
      background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.035));
      box-shadow: 0 30px 100px rgba(0,0,0,.28), inset 0 1px rgba(255,255,255,.12);
      text-align: center;
      backdrop-filter: blur(14px);
    }

    .eyebrow {
      margin: 0 0 .75rem;
      color: #ff9aa4;
      font: 600 .72rem "Segoe UI", sans-serif;
      letter-spacing: .3em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 4rem);
      font-weight: 400;
      letter-spacing: -.05em;
    }

    .instructions {
      color: #d7e6fb;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .scoreboard {
      display: flex;
      justify-content: center;
      gap: 2.5rem;
      margin: 1.5rem 0;
      color: #ff5261;
      font: 600 1rem "Segoe UI", sans-serif;
    }

    .scoreboard span { color: #fff; }

    #start {
      padding: .8rem 1.3rem;
      border: 1px solid rgba(255,82,97,.5);
      border-radius: 999px;
      background: rgba(220,42,58,.28);
      color: #fff;
      cursor: pointer;
      font: 600 .95rem "Segoe UI", sans-serif;
    }

    #start:hover:not(:disabled) { background: rgba(220,42,58,.42); }
    #start:disabled { cursor: default; opacity: .7; }

    #status {
      min-height: 1.5em;
      color: #d7e6fb;
      font: .95rem "Segoe UI", sans-serif;
    }

    #reward {
      margin: .75rem 0 0;
      padding: .8rem 1rem;
      border: 1px solid rgba(255,82,97,.55);
      border-radius: 1rem;
      background: rgba(220,42,58,.18);
      color: #fff;
      font-size: clamp(1.1rem, 3vw, 1.35rem);
      animation: reward-pop .45s ease-out both;
    }

    #reward[hidden] { display: none; }

    #arena {
      position: relative;
      height: clamp(220px, 42vh, 330px);
      margin-top: 1rem;
      overflow: hidden;
      border: 1px solid rgba(255,82,97,.3);
      border-radius: 1.25rem;
      background: rgba(4,14,34,.45);
    }

    #target {
      position: absolute;
      display: none;
      width: 58px;
      height: 58px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      font: 2.6rem "Segoe UI Symbol", sans-serif;
      filter: drop-shadow(0 0 12px rgba(255,185,207,.65));
      touch-action: manipulation;
    }

    #target:focus-visible, #start:focus-visible, nav a:focus-visible {
      outline: 2px solid #ff5261;
      outline-offset: 4px;
    }

    nav { margin-top: 1.5rem; }

    nav a {
      display: inline-block;
      margin: .3rem;
      padding: .65rem 1rem;
      border: 1px solid rgba(221,237,255,.25);
      border-radius: 999px;
      color: #d7e6fb;
      font: 500 .85rem "Segoe UI", sans-serif;
      text-decoration: none;
    }

    nav a:hover { background: rgba(159,202,255,.16); }

    @keyframes reward-pop {
      from { opacity: 0; transform: scale(.85); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      #reward { animation: none; }
    }
  </style>
  <script src="jogo.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">Um desafio rapidinho</p>
    <h1>Pegue as aranhas</h1>
    <p class="instructions">Clique nas aranhas que aparecerem antes que o tempo acabe!</p>
    <div class="scoreboard" aria-label="Placar">
      <div>Pontos: <span id="score">0</span></div>
      <div>Tempo: <span id="time">15</span>s</div>
    </div>
    <button id="start" type="button">Começar jogo</button>
    <p id="status" aria-live="polite">Você tem 15 segundos. Boa sorte!</p>
    <p id="reward" aria-live="polite" hidden></p>
    <div id="arena" aria-label="Área do jogo">
      <button id="target" type="button" aria-label="Pegar aranha">🕷️</button>
    </div>
    <nav aria-label="Voltar às páginas">
      <a href="index.html">Página inicial</a>
      <a href="carta.html">Ler sua cartinha</a>
    </nav>
  </main>
</body>
</html>
