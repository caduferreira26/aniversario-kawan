<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07152f">
  <title>Sobre o Kawan</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Georgia, "Times New Roman", serif;
      color: #fff;
      background: #07152f;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      background:
        radial-gradient(ellipse at 50% 110%, rgba(20, 112, 220, .48), transparent 55%),
        radial-gradient(ellipse at 12% 18%, rgba(224, 36, 55, .28), transparent 36%),
        linear-gradient(145deg, #102b59, #091a3a 46%, #050e22);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        repeating-conic-gradient(from 0deg at 16% 18%, transparent 0deg 14deg, rgba(220, 235, 255, .09) 14.3deg 14.6deg, transparent 14.9deg 30deg),
        repeating-radial-gradient(circle at 16% 18%, transparent 0 34px, rgba(220, 235, 255, .08) 35px 36px, transparent 37px 65px);
      mask-image: radial-gradient(ellipse at 16% 18%, #000 0%, transparent 68%);
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(92vw, 820px);
      padding: clamp(2rem, 7vw, 4rem);
      border: 1px solid rgba(255, 82, 97, .3);
      border-radius: 2rem;
      background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.035));
      box-shadow: 0 30px 100px rgba(0,0,0,.28), inset 0 1px rgba(255,255,255,.12);
      text-align: center;
      backdrop-filter: blur(14px);
      animation: card-enter .7s ease-out both;
    }

    .eyebrow {
      margin: 0 0 .75rem;
      color: #ff9aa4;
      font: 600 .72rem "Segoe UI", sans-serif;
      letter-spacing: .3em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.7rem, 9vw, 5rem);
      font-weight: 400;
      letter-spacing: -.05em;
      text-shadow: 0 4px 35px rgba(45,139,255,.45);
    }

    .portrait {
      width: 174px;
      margin: 1.5rem auto 0;
      padding: .45rem;
      border: 1px solid rgba(255,82,97,.65);
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(224,36,55,.7), rgba(20,112,220,.75));
      box-shadow: 0 12px 32px rgba(0,0,0,.32), 0 0 28px rgba(45,139,255,.22);
    }

    .portrait img {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      border: 3px solid rgba(7,21,47,.85);
      border-radius: 50%;
      object-fit: cover;
    }

    .intro {
      max-width: 34rem;
      margin: 1rem auto 2rem;
      color: #d7e6fb;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
    }

    .fact-button {
      min-height: 145px;
      padding: 1.25rem 1rem;
      border: 1px solid rgba(221,237,255,.24);
      border-radius: 1.25rem;
      background: rgba(7,21,47,.55);
      color: #fff;
      cursor: pointer;
      font: 500 1rem "Segoe UI", sans-serif;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }

    .fact-button:hover,
    .fact-button[aria-expanded="true"] {
      transform: translateY(-4px);
      border-color: rgba(255,82,97,.75);
      background: rgba(20,58,108,.72);
    }

    .fact-button:focus-visible,
    nav a:focus-visible {
      outline: 2px solid #ff5261;
      outline-offset: 4px;
    }

    .spider {
      display: block;
      margin-bottom: .6rem;
      font: 2.4rem "Segoe UI Symbol", sans-serif;
      filter: drop-shadow(0 0 12px rgba(255,82,97,.45));
    }

    .fact-button:hover .spider,
    .fact-button[aria-expanded="true"] .spider {
      animation: spider-pop .45s ease both;
    }

    .fact {
      min-height: 5.5rem;
      margin: 1.5rem 0 0;
      padding: 1.1rem 1.25rem;
      border-left: 3px solid #e3293f;
      border-radius: .5rem;
      background: rgba(4,14,34,.5);
      color: #d7e6fb;
      font-size: clamp(1.05rem, 3vw, 1.2rem);
      line-height: 1.7;
      text-align: left;
    }

    .fact.is-updating {
      animation: fact-reveal .35s ease both;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .75rem;
      margin-top: 1.75rem;
    }

    nav a {
      padding: .65rem 1rem;
      border: 1px solid rgba(221,237,255,.25);
      border-radius: 999px;
      color: #d7e6fb;
      font: 500 .9rem "Segoe UI", sans-serif;
      text-decoration: none;
    }

    nav a:hover { background: rgba(159,202,255,.16); }

    @keyframes spider-pop {
      50% { transform: translateY(-7px) rotate(-12deg) scale(1.15); }
    }

    @keyframes fact-reveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes card-enter {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 620px) {
      .facts { grid-template-columns: 1fr; }
      .fact-button { min-height: 95px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Sobre o Kawan</h1>
    <figure class="portrait">
      <img src="kauan.png" alt="Kawan" loading="lazy">
    </figure>
    <p class="intro">Cada aranhinha revela uma curiosidade sobre o Kawan! 🕷️</p>

    <section class="facts" aria-label="Curiosidades sobre Kawan">
      <button class="fact-button" type="button" data-fact="Gosta de Olivia Rodrigo e Taylor Swift." aria-expanded="false">
        <span class="spider" aria-hidden="true">🕷️</span>
        Cantoras preferidas
      </button>
      <button class="fact-button" type="button" data-fact="Estuda Direito." aria-expanded="false">
        <span class="spider" aria-hidden="true">🕷️</span>
        Vida de estudante
      </button>
      <button class="fact-button" type="button" data-fact="Gosta de Heartstopper, a série de romance que também tem livros." aria-expanded="false">
        <span class="spider" aria-hidden="true">🕷️</span>
        Série queridinha
      </button>
      <button class="fact-button" type="button" data-fact="Gosta do Homem-Aranha!" aria-expanded="false">
        <span class="spider" aria-hidden="true">🕷️</span>
        Herói favorito
      </button>
      <button class="fact-button" type="button" data-fact="não te perdoou por me matar no roblox" aria-expanded="false">
        <span class="spider" aria-hidden="true">🕷️</span>
        Bônus
      </button>
    </section>

    <p class="fact" id="fact" aria-live="polite">Uma aranhinha guarda uma curiosidade sobre o Kawan ♡</p>

    <nav aria-label="Mais páginas">
      <a href="index.html">Página inicial</a>
      <a href="carta.html">Ler a cartinha</a>
    </nav>
  </main>
  <script>
    const factDisplay = document.querySelector("#fact");
    const factButtons = document.querySelectorAll(".fact-button");

    factButtons.forEach((button) => {
      button.addEventListener("click", () => {
        factButtons.forEach((item) => item.setAttribute("aria-expanded", "false"));
        button.setAttribute("aria-expanded", "true");
        factDisplay.classList.remove("is-updating");
        factDisplay.textContent = button.dataset.fact;
        void factDisplay.offsetWidth;
        factDisplay.classList.add("is-updating");
      });
    });
  </script>
</body>
</html>
