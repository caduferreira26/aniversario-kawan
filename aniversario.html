<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07152f">
  <title>Aniversário do Kawan</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Georgia, "Times New Roman", serif;
      color: #fff;
      background: #07152f;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      text-align: center;
      background:
        radial-gradient(ellipse at 50% 110%, rgba(20, 112, 220, .48), transparent 55%),
        radial-gradient(ellipse at 12% 18%, rgba(224, 36, 55, .28), transparent 36%),
        linear-gradient(145deg, #102b59, #091a3a 46%, #050e22);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        repeating-conic-gradient(from 0deg at 16% 18%, transparent 0deg 14deg, rgba(220, 235, 255, .09) 14.3deg 14.6deg, transparent 14.9deg 30deg),
        repeating-radial-gradient(circle at 16% 18%, transparent 0 34px, rgba(220, 235, 255, .08) 35px 36px, transparent 37px 65px);
      mask-image: radial-gradient(ellipse at 16% 18%, #000 0%, transparent 68%);
      pointer-events: none;
    }

    .entry-burst {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 1;
      width: min(80vw, 42rem);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(224,36,55,.17), rgba(20,112,220,.1) 40%, transparent 68%);
      box-shadow: 0 0 0 1px rgba(255,82,97,.3), 0 0 0 22px rgba(20,112,220,.08), 0 0 0 44px rgba(255,82,97,.05);
      opacity: 0;
      transform: translate(-50%, -50%) scale(.55);
      animation: web-burst 1s ease-out both;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 2;
      width: min(90vw, 650px);
      padding: clamp(2.5rem, 8vw, 5rem) 2rem;
      border: 1px solid rgba(255, 82, 97, .3);
      border-radius: 2rem;
      background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.035));
      box-shadow: 0 30px 100px rgba(0,0,0,.28), inset 0 1px rgba(255,255,255,.12);
      backdrop-filter: blur(14px);
      animation: card-enter .75s cubic-bezier(.2,.8,.25,1) both;
    }

    .cake {
      margin: 0 0 1rem;
      font: 2.5rem "Segoe UI Symbol", sans-serif;
    }

    .eyebrow {
      margin: 0 0 .75rem;
      color: #ff9aa4;
      font: 600 .72rem "Segoe UI", sans-serif;
      letter-spacing: .3em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 400;
      letter-spacing: -.05em;
      text-shadow: 0 4px 35px rgba(45,139,255,.45);
    }

    .date {
      margin: 1rem 0 1.5rem;
      color: #ff5261;
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      font-style: italic;
    }

    .message {
      margin: 0;
      color: #d7e6fb;
      font-size: clamp(1.1rem, 3vw, 1.35rem);
      line-height: 1.7;
    }

    nav { margin-top: 2rem; }

    nav a {
      display: inline-block;
      margin: .35rem;
      padding: .7rem 1.1rem;
      border: 1px solid rgba(221,237,255,.3);
      border-radius: 999px;
      color: #d7e6fb;
      font: 500 .9rem "Segoe UI", sans-serif;
      text-decoration: none;
    }

    nav a:hover, nav a:focus-visible { background: rgba(159,202,255,.16); }

    @keyframes web-burst {
      0% { opacity: .8; transform: translate(-50%, -50%) scale(.55); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.25); }
    }

    @keyframes card-enter {
      from { opacity: 0; transform: translateY(24px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .entry-burst { display: none; }
      main { animation: none; }
    }
  </style>
</head>
<body>
  <div class="entry-burst" aria-hidden="true"></div>
  <main>
    <p class="cake" aria-hidden="true">🎂</p>
    <h1>Aniversário do Kawan</h1>
    <p class="date">15 de novembro</p>
    <p class="message">o menino dos olhinhos mais fofos que já vi</p>
    <nav aria-label="Voltar às páginas">
      <a href="index.html">Página inicial</a>
      <a href="carta.html">Ler sua cartinha</a>
    </nav>
  </main>
</body>
</html>
